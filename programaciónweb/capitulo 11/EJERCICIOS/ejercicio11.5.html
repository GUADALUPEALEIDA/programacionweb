<!DOCTYPE html>
<html>
    <head>   
    <div class="reg">
        <a class="regresar" href="ejercicios.html">⬅</a>
    </div>
        <meta charset="utf-8">
        <title>EJERCICIO</title>
        <style>
            table { border-collapse: collapse; }
            th, td { border: 1px solid black; padding: 2px 10px; }
            textarea { font-family: monospace; }
        </style>
        <script>
            var filas = "";

            function redondearAEntero( numero )
            {
                return Math.round( numero );
            } // fin de la función redondearAEntero

            function redondearADecimas( numero )
            {
                return Math.round( numero * 10 ) / 10;
            } // fin de la función redondearADecimas

            function redondearACentesimas( numero )
            {
                return Math.round( numero * 100 ) / 100;
            } // fin de la función redondearACentesimas

            function redondearAMilesimas( numero )
            {
                return Math.round( numero * 1000 ) / 1000;
            } // fin de la función redondearAMilesimas

            function redondear()
            {
                var campo = document.getElementById( "numero" );
                var x = parseFloat( campo.value );

                if ( isNaN( x ) )
                {
                    alert( "Escriba un número válido" );
                    return;
                } // fin de if

                filas += "<tr><td>" + x + "</td><td>" + redondearAEntero( x ) + "</td><td>" +
                    redondearADecimas( x ) + "</td><td>" + redondearACentesimas( x ) + "</td><td>" +
                    redondearAMilesimas( x ) + "</td></tr>";

                document.getElementById( "resultado" ).innerHTML =
                    "<table><tr><th>Original</th><th>Entero</th><th>Décimas</th>" +
                    "<th>Centésimas</th><th>Milésimas</th></tr>" + filas + "</table>";
                campo.value = "";
            } // fin de la función redondear

            function iniciar()
            {
                document.getElementById( "botonRedondear" ).addEventListener( "click", redondear, false );
            } // fin de la función iniciar

            window.addEventListener( "load", iniciar, false );
        </script>
    </head>
    <body>
    <h3>EJERCICIO 11.5</h3>
    <p>Modifique la solución al ejercicio 11.4 para usar el método round de Math en vez del método floor.</p>
    <form action = "#">
        <p><label>Número: <input id = "numero" type = "text"></label>
        <input id = "botonRedondear" type = "button" value = "Redondear"></p>
    </form>
    <div id = "resultado"></div>
    </body>
</html>
