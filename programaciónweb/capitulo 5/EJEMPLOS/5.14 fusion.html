<!DOCTYPE html>
<html>
   <head>
      <meta charset = "utf-8">
      <title>Fusi&oacute;n de im&aacute;genes</title>
      <style type = "text/css">
         #portada
         {
            position: relative;
            margin: 0 auto;
         }
         #portada img
         {
            position: absolute;
            left: 0;
            -webkit-transition: opacity 4s ease-in-out;
            transition: opacity 4s ease-in-out;
         }
         #portada img.top:hover
            { opacity:0; }
      </style>
   </head>
   <body>
        <div class="reg">
        <a class="regresar" href="ejemplos.html">⬅</a>
        </div>
      <div id= "portada">
         <img class = "bottom" src = "imagenes/ola.png" alt = "Portada de Java 9e">
         <img class = "top" src = "imagenes/ola2.png" alt = "Portada de Java 8e">
      </div>
   </body>
</html>
