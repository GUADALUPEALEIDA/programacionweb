<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Inclinar (skew)</title>

      <style type="text/css">
         .skew .textbox
         {
            margin-left: 75px;
            background: lightgreen;
            height: 100px;
            width: 200px;
            padding: 25px 0;
            text-align: center;
            font-size: 250%;
            border: 3px solid DarkGreen;
            border-radius: 15px;

            -webkit-animation: skew 3s infinite linear;
            -moz-animation: skew 3s infinite linear;
            animation: skew 3s infinite linear;
         }

         @-webkit-keyframes skew
         {
            from { -webkit-transform: skewX(0deg); }
            25% { -webkit-transform: skewX(45deg); }
            50% { -webkit-transform: skewX(0deg); }
            75% { -webkit-transform: skewX(-45deg); }
            to { -webkit-transform: skewX(0deg); }
         }

         @-moz-keyframes skew
         {
            from { -moz-transform: skewX(0deg); }
            25% { -moz-transform: skewX(45deg); }
            50% { -moz-transform: skewX(0deg); }
            75% { -moz-transform: skewX(-45deg); }
            to { -moz-transform: skewX(0deg); }
         }

         @keyframes skew
         {
            from { transform: skewX(0deg); }
            25% { transform: skewX(45deg); }
            50% { transform: skewX(0deg); }
            75% { transform: skewX(-45deg); }
            to { transform: skewX(0deg); }
         }
      </style>
   </head>

   <body>
        <div class="reg">
        <a class="regresar" href="ejemplos.html">⬅</a>
        </div>
      <div class="box skew">
         <div class="textbox">Inclinar texto</div>
      </div>
   </body>
</html>
