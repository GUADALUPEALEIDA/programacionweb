<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Borde de imagen</title>
        <style type="text/css">
            .caja{
                border-style: solid;
                border-width: 30px;
                width: 234px;
                padding: 20px 20px;
                margin-bottom: 20px;
            }
            #stretch
            {
                border-image: url(imagenes/borde.png) 80 80 80 80 stretch;
            }
            #repeat
            {
                border-image: url(imagenes/borde.png) 80 80 80 80 repeat;
            }
        </style>
    </head>
    <body>
        <div class="reg">
        <a class="regresar" href="ejemplos.html">⬅</a>
        </div>
        <h2>BORDES DE IMAGEN</h2>
        <img src="imagenes/borde.png" alt="imagen utilizada para demostrar los bordes">
        <div class="caja" id="stretch">se estira el borde de la imagen</div>
        <div class="caja" id="repeat">se repite el borde de la imagen</div>
    </body>
</html>
