   <title>Esquinas redondeadas</title>

</head>

   <h3>5.5 ESQUINAS REDONDAS</h3>
   <p>3 div de 100x100, border 3px black, border-radius 10px/50px/100px, fondo distinto, valor en negrita.</p>
   <hr>
   <div class="caja" id="c1"><b>10px</b></div>
   <div class="caja" id="c2"><b>50px</b></div>
   <div class="caja" id="c3"><b>100px</b></div>
</body>
