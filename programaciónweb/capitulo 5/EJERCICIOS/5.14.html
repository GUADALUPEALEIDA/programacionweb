<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <title>Transformación con hover</title>
   <style type="text/css">
      img {
         width: 80px; height: 100px;
         float: left; margin-right: 10px;
         transition: transform .3s;
      }
      img:hover { transform: scale(1.2); }
   </style>
</head>
<body>
   <div class="reg">
        <a class="regresar" href="ejercicios.html">⬅</a>
   </div>
   <h3>5.14 Transformación CON :HOVER</h3>
   <p>4 imágenes; al pasar el mouse, el tamaño aumenta un 20%.</p>
   <img src="imagenes/img1.png" alt="Imagen 1">
   <img src="imagenes/img2.png" alt="Imagen 2">
   <img src="imagenes/img3.png" alt="Imagen 3">
   <img src="imagenes/img4.png" alt="Imagen 4">
</body>
</html>
